name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # runner 镜像通常已经带了 platform/build-tools/ndk/cmake，齐了就不再下载。
      # 缺哪个才走 setup-android 补装。
      - name: Check Android SDK
        id: sdk
        run: |
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          ok=1
          for p in "platforms/android-36" "build-tools/36.0.0" "ndk/27.0.12077973" "cmake/3.22.1"; do
            [ -d "$SDK/$p" ] || { echo "missing $p"; ok=0; }
          done
          [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ] || ok=0
          if [ "$ok" = "1" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi

      - uses: android-actions/setup-android@v3
        if: steps.sdk.outputs.skip != '1'
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      # 还原签名密钥 + 构建 + 重命名
      - name: Build
        env:
          KEYSTORE_PATH: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: texinject
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          chmod +x gradlew
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore/release.jks
          ./gradlew assembleRelease --build-cache
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TexInject-$VER.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: TexInject-apk
          path: out/*.apk
          if-no-files-found: error
          # APK 已经是压缩包，再压一遍纯浪费 CPU
          compression-level: 0

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          body_path: docs/发布说明.md
