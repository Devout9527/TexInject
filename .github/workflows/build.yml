name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 签名密钥从 Secrets 还原（不入库）
      - name: Decode signing keystore
        run: |
          set -e
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore/release.jks
          ls -la keystore/

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: texinject
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 按版本号重命名（发行资产名字要清楚）
      - name: Rename APK
        run: |
          set -e
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "versionName=$VER"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TexInject-$VER.apk"
          ls -la out/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TexInject-release-signed
          path: out/TexInject-*.apk
          if-no-files-found: error

      # 打 v* tag 时自动创建 GitHub Release，并把 APK 附上去
      # 说明只在私人仓库(开发仓)写；公共仓库保持空白
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/TexInject-*.apk
          generate_release_notes: ${{ github.repository == 'Devout9527/TexInject-dev' }}
          body: ${{ github.repository == 'Devout9527/TexInject-dev' && '开发构建（私人仓库）。适配游戏版本 3.9.15.297907。' || '' }}
