name: Build Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 签名密钥从 Secrets 还原（不入库）
      - name: Decode signing keystore
        run: |
          set -e
          mkdir -p keystore
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore/release.jks
          ls -la keystore/

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: texinject
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 按版本号重命名（发行资产名字要清楚）
      - name: Rename APK
        run: |
          set -e
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "versionName=$VER"
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/TexInject-$VER.apk"
          ls -la out/

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: TexInject-release-signed
          path: out/TexInject-*.apk
          if-no-files-found: error

      # 打 v* tag 时自动创建 GitHub Release，并把 APK 附上去
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/TexInject-*.apk
          generate_release_notes: true
          body: |
            ## TexInject

            Minecraft 中国版（网易版，`com.netease.x19`）增强面板模块。

            **适配游戏版本：3.9.15.297907**

            ### 功能
            - 材质包注入 / 恢复官方资源 / 主页视频替换 / 重载外观
            - 网易云音乐播放器（在线播放、扫码登录、歌词、播放条）
            - Python 脚本加载器（`.py` 直接执行，`.mcp` 注册加载）
            - 渲染：圆盘雷达
            - 快捷键：MCP 模块开关，可挂悬浮窗
            - 设置：播放模式 / 播放条尺寸 / 面板布局 / 分类图标大小 / 雷达选项

            ### 环境
            - 需要 LSPosed（现代 LibXposed API 102）
            - 作用域：`com.netease.x19`
            - 仅 arm64-v8a

            ### 安装
            1. 安装 APK
            2. LSPosed 里启用本模块，作用域勾选「我的世界（网易版）」
            3. 重启游戏
            4. 首次运行会自动在
               `/storage/emulated/0/Android/data/com.netease.x19/files/pack_netease/`
               下创建 `resource_packs` / `icon` / `scripts` 等目录，并有 `README.txt` 说明

            ### 许可
            本项目以 **GNU Affero General Public License v3.0 (AGPL-3.0)** 发布。
            完整文本见仓库根目录 `LICENSE`。

            AGPL 第 13 条：若通过网络向用户提供本程序的服务，必须向这些用户提供
            获取完整源代码的途径。本模块以二进制分发，源码见：
            https://github.com/Devout9527/TexInject

            > 材质包注入 / 视频替换功能来自 Kusug UI（作者：bi匕匕bi）。
